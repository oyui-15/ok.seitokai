<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回答状況｜生徒会オンライン目安箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-head"><div class="wrap">
  <a class="brand" href="index.html"><img class="crest" src="kaisei_26.jpg" alt="校章"></span><span><small data-school>大宮開成高校</small>オンライン目安箱</span></a>
  <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav"><span></span></button>
  <nav class="nav" id="nav" aria-label="メインメニュー">
    <a href="index.html">ホーム</a><a href="answers.html" aria-current="page">回答状況</a><a href="council.html">生徒会</a>
  </nav>
</div></header>

<main>
<section><div class="wrap">
  <h1 style="font-size:1.8rem;color:var(--navy)">回答・対応状況</h1>
  <p class="lead">目安箱に届いた意見と、生徒会の対応です。反映までに時間がかかります。</p>
  <ul class="legend" aria-label="ステータスの意味">
    <li><span class="pill s2">確認中</span></li>
    <li><span class="pill s3">対応中</span></li><li><span class="pill s4">回答済み</span></li><li><span class="pill s5">対応完了</span></li>
  </ul>
  <div class="filters">
    <input id="f-q" type="search" placeholder="キーワードで探す" aria-label="キーワード">
    <select id="f-cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select>
    <select id="f-status" aria-label="ステータス"><option value="">すべての状況</option>
      <option>確認中</option><option>対応中</option><option>回答済み</option><option>対応完了</option></select>
    <button id="f-reset" type="button">クリア</button>
  </div>
  <p class="count" id="f-count" aria-live="polite"></p>
  <div class="answers" id="answer-list"></div>
  <p class="row-cta"><a class="btn" data-form href="#">目安箱に意見を送る</a></p>
</div></section>
</main>
<footer><div class="wrap"><span data-school>大宮開成高校</span> <span data-council>生徒会</span> ／ このサイトは生徒会が運営しています</div></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body></html>
